name: Build Dodge Rush APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check project
        run: |
          echo "Checking Dodge Rush project..."
          if [ ! -f "settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle.kts not found."
            echo "Make sure the EXTRACTED V4 project files are in the repository root."
            ls -lah
            exit 1
          fi

          if [ ! -d "app" ]; then
            echo "ERROR: app folder not found."
            ls -lah
            exit 1
          fi

          echo "Project looks good."

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Dodge Rush
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DodgeRush-V4-APK
          path: app/build/outputs/apk/debug/app-debug.apk
