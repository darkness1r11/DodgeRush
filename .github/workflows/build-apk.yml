name: Build Dodge Rush APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract V4 project
        run: |
          echo "Finding Dodge Rush ZIP..."

          ZIP=$(find . -maxdepth 1 -type f -iname 'DodgeRush-V4*.zip' | head -1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: DodgeRush V4 ZIP not found!"
            ls -lah
            exit 1
          fi

          echo "Found: $ZIP"

          mkdir project
          unzip -o "$ZIP" -d project

          echo "Project files:"
          ls -lah project

      - name: Check project
        run: |
          if [ ! -f "project/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle.kts missing!"
            find project -maxdepth 2 -type f
            exit 1
          fi

          if [ ! -d "project/app" ]; then
            echo "ERROR: app folder missing!"
            find project -maxdepth 2 -type d
            exit 1
          fi

          echo "PROJECT STRUCTURE OK!"

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: project
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DodgeRush-V4-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
