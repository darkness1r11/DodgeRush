name: Build Dodge Rush APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate and extract source ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name 'DodgeRush-V3-Source.zip' | head -1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: DodgeRush-V3-Source.zip was not found."
            ls -lah
            exit 1
          fi

          echo "Found: $ZIP"
          mkdir -p project
          unzip -o "$ZIP" -d project

          echo "Project contents:"
          ls -lah project

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: project
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DodgeRush-V3-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
